name: Playwright QA

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:api
        env:
          SSENSUUM_WEB_BASE_URL: ${{ secrets.SSENSUUM_WEB_BASE_URL }}
          SSENSUUM_API_BASE_URL: ${{ secrets.SSENSUUM_API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
